<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header>
        <h1>✈️ Travel Experience</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="index.html#destino">Destinos</a>
        </nav>
    </header>

    <main class="area-Cadastro">
        <form id="formCadastro">
            <h2>Planeja sua proxima viagem!</h2>

            <label for="nome">nome:</label>
            <input type="text" id="nome" placeholder="digite seu nome..." required><br><br>

            <label for="email">email:</label>
            <input type="email" id="email" placeholder="digite seu email..." required><br><br>

            <label for="Destinos">Destinos desejados:</label>

            <select name="destino" id="destino">
                <option value="">Escolha o destino</option>
                <option value="Rio de Janeiro">Rio de Janeiro</option>
                <option value="Paris">Paris</option>
                <option value="Maldivas">Maldivas</option>
            </select>
            <button type="submit">Enviar cadastro</button>
            <p id="mensagem" aria-live="polite"></p>
            <a href="index.html" class="voltar">
                voltar para o Inicio
            </a>

        </form>
    </main>
    <footer>
        <p>Travel Experience 2026</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
