
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/style.css">
    <title>Loja de Roupas</title>
</head>
<body>

    <header>
        <h1>👕Loja de Roupas👚</h1>
    </header>


    <main class="carrossel">

        <div class="trilho">

        <div class="slide">
            <img src="img/camiseta.jpg" alt="Camiseta cachorro">
            <h2>Camisetas</h2>
            <p class="preco">R$49,00</p>
        </div>

        <div class="slide">
                <img src="img/calça.jpg" alt="Calça">
                <h2>Calça</h2>
                <p class="preco">R$67,00</p>
            </div>

            <div class="slide">
                    <img src="img/jaqueta.jpg" alt="Jaqueta Couro">
                    <h2>Jaqueta</h2>
                    <p class="preco">R$100,00</p>
                </div>

                <div class="slide">
                    <img src="img/tenis.webp" alt="Tenis aura">
                    <h2>tenis</h2>
                    <p class="preco">R$670,00</p>
                    </div>

                    <div class="slide">
                         <img src="img/vestido.jpg" alt="Vestido">
                        <h2>Vestido</h2>
                        <p class="preco">R$167,00</p>
                     </div>
                    
                </div>
        </main>

</body>
</html>
